name: Discover official conference candidates
on:
  schedule:
    - cron: "41 3 * * 1"
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: living-evidence-metadata
  cancel-in-progress: false
jobs:
  update:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - name: Collect bounded public metadata
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python scripts/discover_official_candidates.py
      - name: Check scientific snapshot is unchanged
        run: python scripts/check_public_release.py
      - name: Save dated metadata only
        id: commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add runs/wp1/search service/data/discovery_queue_2026_partial.json
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Update dated public metadata: Discover official conference candidates"
            git push origin main
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish updated metadata
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main
