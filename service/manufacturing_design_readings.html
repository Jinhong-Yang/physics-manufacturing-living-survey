<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>공개 자산에서 제조 실험까지</title><link rel="stylesheet" href="styles.css"><style>
.design-layout{display:grid;grid-template-columns:280px minmax(0,1fr);gap:24px;margin-top:24px}.design-list{display:grid;gap:12px}.design-list button{text-align:left;padding:18px;border:1px solid #cddde4;background:white;border-radius:12px;color:#17374b;cursor:pointer}.design-list button[aria-pressed=true]{background:#eaf6f5;border-color:#007f84}.design-list small{display:block;margin-top:8px}.design-detail{padding:26px;overflow-wrap:anywhere}.design-detail p,.design-detail li{line-height:1.75}.design-detail li{margin-bottom:18px}.design-limit{padding:16px;border-left:4px solid #ad6817;background:#fff5e8}.design-meta{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:22px 0}.design-meta div{padding:14px;background:#edf3f6;border-radius:10px}.design-meta b{display:block;margin-bottom:6px}.design-search{width:100%;padding:12px;border:1px solid #cbdce4;border-radius:9px}.claim-kind{font-size:13px;color:#596871}@media(max-width:760px){.design-layout{grid-template-columns:1fr}.design-meta{grid-template-columns:1fr}.design-list{grid-template-columns:repeat(2,minmax(0,1fr))}.design-detail{padding:19px}}
</style></head><body><main class="app-shell"><header class="hero"><div><p class="eyebrow">공개 자산 · 입력 · 실행 · 물리 검증</p><h1>공개 자산에서 제조 실험까지</h1><p>코드 링크 다음에 필요한 입력 규약, 실행 방식과 산업 사용 근거를 확인합니다.</p></div><a class="button-link" href="index.html">연구 목록으로</a></header>
<section class="panel" style="padding:22px"><p id="design-scope">근거를 불러오고 있습니다.</p><p class="design-limit">두 연구는 제조 설계 경계 사례입니다. 독립 포함 판정은 대기 중이며, 이 화면은 본문·정적 검토 당시의 기록입니다. 이후 GearFormer 실행은 별도 근거 화면에서 확인합니다. 산업 통과는 추가하지 않았습니다.</p></section>
<div class="design-layout"><aside><label for="design-search">방법 또는 근거 검색</label><input type="search" class="design-search" id="design-search" placeholder="예: tokenizer, CSV, drilling"><p id="design-count" aria-live="polite"></p><div class="design-list" id="design-list"></div></aside><article class="panel design-detail" id="design-detail" aria-live="polite"></article></div><footer><p>이전 관측과 최신 고정 버전의 근거를 함께 보존합니다. 직접 사용 가능 여부는 지정한 제조 조건에서 검증합니다.</p></footer></main><script src="manufacturing_design_readings.js?v=0.9.38" defer></script></body></html>
