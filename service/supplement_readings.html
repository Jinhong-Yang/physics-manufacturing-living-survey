<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>보충자료와 제조 사용 조건</title><link rel="stylesheet" href="styles.css"><style>
.supp-layout{display:grid;grid-template-columns:290px minmax(0,1fr);gap:24px;margin-top:24px}.supp-list{display:grid;gap:10px;align-content:start}.supp-list button{text-align:left;border:1px solid #d7e2e8;border-radius:12px;padding:16px;background:white;cursor:pointer;color:#14334a}.supp-list button[aria-pressed="true"]{border-color:#007f84;background:#eaf6f5}.supp-list small{display:block;margin-top:7px;color:#52616d}.supp-detail{padding:26px}.supp-detail h2{margin-top:0}.supp-detail li{margin-bottom:15px}.supp-meta{display:flex;flex-wrap:wrap;gap:10px;margin:16px 0}.supp-meta span{padding:7px 10px;border-radius:8px;background:#edf3f6;font-size:14px}.supp-limit{padding:15px;border-left:4px solid #b06813;background:#fff5e8;line-height:1.7}.supp-detail details{overflow-wrap:anywhere}.supp-detail p,.supp-detail li{line-height:1.7}.supp-search{width:100%;padding:12px;border:1px solid #ccdce4;border-radius:9px}.supp-error{padding:25px;background:#fff0ed}@media(max-width:760px){.supp-layout{grid-template-columns:1fr}.supp-list{grid-template-columns:repeat(2,minmax(0,1fr))}.supp-detail{padding:20px}}@media(max-width:450px){.supp-list{grid-template-columns:1fr}}
</style></head><body><main class="app-shell"><header class="hero"><div><p class="eyebrow">보충자료의 실행 조건과 평가 범위</p><h1>제조 사용 판단에 필요한 추가 근거</h1><p>원문 부록의 입력·물리 가정·비용·실패 조건을 기존 실행 결과와 함께 확인합니다.</p></div><a class="button-link" href="index.html">연구 목록으로</a></header>
<section class="panel" style="padding:22px"><p id="supp-scope">검토 범위를 불러오고 있습니다.</p><p class="supp-limit">같은 AI의 문헌 검토입니다. 저자 보고 수치는 새 실험 결과와 구분하며, 독립 물리 검증과 산업 통과 판정을 추가하지 않습니다. SeaS 25쪽의 일부 글자는 가려져 있습니다.</p></section>
